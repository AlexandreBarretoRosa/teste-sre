# Secret para autenticação básica do Grafana
apiVersion: v1
kind: Secret
metadata:
  name: grafana-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ printf "admin:%s" .Values.grafana.adminPassword | b64enc }}
---
# Secret para autenticação básica do Prometheus
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ printf "admin:prometheus123" | b64enc }}
---
# Secret para autenticação básica do Alertmanager
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ printf "admin:alertmanager123" | b64enc }} 